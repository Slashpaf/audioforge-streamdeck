name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Type-check plugin
        run: npm run typecheck

      - name: Check manifest and package contents
        run: node scripts/verify-manifest.mjs

      - name: Require a project license for releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -s LICENSE

      - name: Package and validate Elgato installer
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package version v${version}." >&2
            exit 1
          fi
          ./scripts/package-elgato.sh "dist/elgato"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package and validate OpenDeck archive
        shell: bash
        run: ./scripts/package-plugin.sh "dist/opendeck/Audio-Forge-v${{ steps.package.outputs.version }}-opendeck.zip" --require-license

      - name: Collect release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-files
          # GitHub shows a SHA-256 digest for every release file, so no separate checksum files.
          cp dist/elgato/com.slashpaf.audioforge.streamDeckPlugin release-files/
          cp dist/opendeck/Audio-Forge-v*-opendeck.zip release-files/

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-release
          path: release-files/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-release
          path: release-assets

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes come from this version's CHANGELOG.md section.
          awk -v v="$version" '
            /^## / { if (found) exit; found = index($0, "## " v " ") == 1 || $0 == "## " v; next }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${version}." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
