<!doctype html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./pi-styles.css" />
  <script src="./vendor/sdpi-components.v3.0.2.js"></script>
  <script src="./common.js"></script>
</head>
<body>
  <div class="connection-bar">
    <span class="dot" id="status-dot"></span>
    <span id="connection-status">Checking...</span>
  </div>

  <sdpi-item label="Section">
    <sdpi-select setting="section">
      <option value="Music">Music</option>
      <option value="Ambiance">Ambiance</option>
      <option value="Echoes">Echoes</option>
    </sdpi-select>
  </sdpi-item>

  <sdpi-item label="Category">
    <sdpi-select setting="categoryUuid" datasource="getCategories" placeholder="Whole section"></sdpi-select>
  </sdpi-item>
  <p class="help-text" style="margin-top:2px;">Optional (Music and Ambiance). Controls one category's volume instead of the whole section.</p>

  <sdpi-item label="Dial Step">
    <sdpi-select setting="step" default="5">
      <option value="1">1%</option>
      <option value="2">2%</option>
      <option value="5">5%</option>
      <option value="10">10%</option>
      <option value="25">25%</option>
    </sdpi-select>
  </sdpi-item>
  <p class="help-text" style="margin-top:2px;">Volume change per dial click.</p>

  <hr class="section-divider" />
  <p class="help-text">
    <b>Dial rotate:</b> adjusts volume by the step amount.<br/>
    <b>Dial press:</b> toggles mute / unmute.
  </p>

  <hr class="section-divider" />
  <details>
    <summary style="font-size:12px;color:#999;cursor:pointer;">Connection Settings</summary>
    <sdpi-item label="Host"><sdpi-textfield setting="host" id="host-input" global placeholder="localhost"></sdpi-textfield></sdpi-item>
    <sdpi-item label="Port"><sdpi-textfield setting="port" id="port-input" global placeholder="8329"></sdpi-textfield></sdpi-item>
    <sdpi-item label="API Key"><sdpi-password setting="apiKey" id="apikey-input" global placeholder="(optional)"></sdpi-password></sdpi-item>
  </details>

  <script>
    setTimeout(() => { updateConnectionStatus(); startConnectionPolling(); }, 500);
  </script>
</body>
</html>
